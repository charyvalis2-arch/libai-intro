<script>
var FF="'Noto Sans TC','PingFang TC','Microsoft JhengHei','Heiti TC',sans-serif";
var INK='#4a353f', MUTE='#7d6b73';
var CO={du:'#e68a2c', li:'#2b2859', me:'#a82024', wa:'#2e8b3a'};
var DK={du:'#b56810', li:'#2b2859', me:'#a82024', wa:'#236b2d'};
var MO={smile:'M-5 18q2.5 4 5 0q2.5 4 5 0', flat:'M-6 20h12', open:'M-8 16Q0 28 8 16', worry:'M-8 24Q0 15 8 24'};

function T(x,y,s,z,f,w,a){
  return '<text x="'+x+'" y="'+y+'" font-size="'+z+'" fill="'+(f||INK)+'" font-weight="'+(w||400)+'" text-anchor="'+(a||'middle')+'" font-family="'+FF+'">'+s+'</text>';
}
function L(x,y,arr,z,gap,f,w,a){
  var o='';for(var i=0;i<arr.length;i++){o+=T(x,y+i*gap,arr[i],z,f,w,a);}return o;
}
function CardAvatar(x,y,s,k,m){
  var c=CO[k],sw=Math.max(2.5,2.2/s).toFixed(1);
  return '<g transform="translate('+x+','+y+') scale('+s+')" fill="#fffcf5" stroke="'+c+'" stroke-width="'+sw+'" stroke-linecap="round" stroke-linejoin="round">'+
    '<rect x="-42" y="-45" width="84" height="96" rx="24" fill="#fffdfa" stroke="'+c+'" stroke-width="'+sw+'"/>'+
    '<circle cx="-16" cy="-8" r="10"/><circle cx="16" cy="-8" r="10"/><path d="'+MO[m||'smile']+'" fill="none"/>'+
    '<path d="M-36 -32Q0 -44 36 -32" fill="none" stroke-linecap="round"/>'+
  '</g>';
}
function Badge(x,y,text,bg,fg){
  return '<g transform="translate('+x+','+y+')"><rect x="-140" y="-18" width="280" height="36" rx="10" fill="'+bg+'"/><text x="0" y="6" font-size="15" fill="'+(fg||'#fff')+'" font-weight="600" text-anchor="middle" font-family="'+FF+'">'+text+'</text></g>';
}
function Arrow(x1,y1,x2,y2,c,d){
  var a=Math.atan2(y2-y1,x2-x1),h=12;
  function hd(x,y,t){return '<path d="M'+(x-h*Math.cos(t-0.45)).toFixed(1)+' '+(y-h*Math.sin(t-0.45)).toFixed(1)+'L'+x+' '+y+'L'+(x-h*Math.cos(t+0.45)).toFixed(1)+' '+(y-h*Math.sin(t+0.45)).toFixed(1)+'" fill="none" stroke="'+c+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';}
  return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="2.5" stroke-linecap="round"'+(d?' stroke-dasharray="'+d+'"':'')+'/>'+hd(x2,y2,a);
}
function Frame(inner){return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 680" width="680" height="680"><rect width="680" height="680" fill="#fcf9f2"/><rect x="24" y="24" width="632" height="632" rx="16" fill="none" stroke="#e8dfcb" stroke-width="2"/>'+inner+'</svg>';}
function FooterTag(s){return T(340,644,s,14,MUTE,500);}

var S=[];
function add(t,svg,n){S.push({t:t,svg:svg,n:n});}

// 1. 封面

// 5. 按照詩詞圈的慣例
add('按照詩詞圈的慣例',Frame(

add('公元 744 年',Frame(

  T(210,325,'33 歲 杜甫（追星）',20,DK.du,700)+

// 10. 只見面三次
add('只見面三次',Frame(
  T(340,70,'短暫卻震撼一生的交集',22,MUTE,600)+
  T(340,130,'李白和杜甫一生只見面三次！',30,INK,700)+
  '<rect x="80" y="170" width="520" height="100" rx="14" fill="#fff" stroke="#e8dfcb" stroke-width="2"/>'+
  T(340,210,'【三次同遊路線】',18,DK.li,600)+
  T(340,245,'744 洛陽相遇 ➔ 梁宋同遊（與高適） ➔ 745 齊魯再聚',18,INK,700)+

add('杜甫超級想李白',Frame(

  CardAvatar(340,220,1.6,'du','worry')+

function pad(n){return (n<10?'0':'')+n;}

  $('msg-text').textContent = text;
  $('msg-modal').style.display = 'flex';
}

  $('msg-modal').style.display = 'none';

  html+='<div class="cd"><div class="hd"><span>'+pad(i+1)+'. '+S[i].t+'</span><button data-d="'+i+'">下載 PNG</button></div><div class="sv" data-o="'+i+'" data-r="'+i+'"></div><p class="nt">'+S[i].n+'</p></div>';
}
$('g').innerHTML=html;
(function(){var els=document.querySelectorAll('[data-r]');
function fill(e){var k=e.getAttribute('data-r');if(k!==null){e.innerHTML=S[+k].svg;e.removeAttribute('data-r');}}
if('IntersectionObserver' in window){var io=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting){fill(en.target);io.unobserve(en.target);}});},{rootMargin:'400px 0px'});els.forEach(function(e){io.observe(e);});}
else{els.forEach(fill);}})();

function toPng(i){return new Promise(function(res){
var img=new Image();
var url=URL.createObjectURL(new Blob([S[i].svg],{type:'image/svg+xml;charset=utf-8'}));
img.onload=function(){
var c=document.createElement('canvas');c.width=1080;c.height=1080;
var x=c.getContext('2d');x.fillStyle='#fcf9f2';x.fillRect(0,0,1080,1080);x.drawImage(img,0,0,1080,1080);
URL.revokeObjectURL(url);
c.toBlob(function(b){var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='slide_'+pad(i+1)+'.png';document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(a.href);},3000);res();},'image/png');
};

var NAR=["各位同學，今天我們要來聊大唐四人行：李白、杜甫、孟浩然、王維。先問大家一個問題：如果唐朝有私訊，誰會是那個已讀不回的人？先猜猜看，等一下我們再來揭曉。", "先來聽一個假趣事：李白很常考試不及格，因為他字太白，所以看不到考題。這當然是網路諧音梗，是戲說喔！真相是，李白一生根本沒有進過考場。原因說法不一，有人說是商人之子的身份受限制，也有人說是家族曾因罪遷徙。他走的是名流舉薦的路線。", "接下來是成分分析。詩仙李白的靈魂組成：美酒百分之七十，明月百分之二十，劍術百分之十，加起來剛好一百。這是戲說，用來形容他豪飲狂歌、浪漫至極的性格。", "二十多歲的李白，在襄陽認識了大他一輪的孟浩然。他寫了一首〈贈孟浩然〉：「吾愛孟夫子，風流天下聞。」直接大方告白，是不是很像追星的迷弟呢？", "在唐代的詩詞圈，互相贈詩是很大的社交傳統，至於回不回詩，又是另一回事。專家提醒，沒有留下回詩，不等於冷漠或沒交情。古人也常常透過口頭、書信或見面來切磋交流。", "李白送給孟浩然的，是千古名篇〈黃鶴樓送孟浩然之廣陵〉：「故人西辭黃鶴樓，煙花三月下揚州。孤帆遠影碧空盡，唯見長江天際流。」他在樓上看著船影消失，久久捨不得離開。但是，孟浩然的詩集裡，卻找不出明確回贈給李白的詩。這是單向奔赴，說他已讀不回，則是戲說喔。", "孟浩然真的一首都沒有回給李白嗎？這一點要標上待查證：現存的孟浩然集裡，沒有看到明確回贈李白的作品。可能是作品遺失，也可能是當面口頭回應，這只是推論。", "新成員登場！這位是杜子美，也就是後來被稱為詩聖的杜甫，生活在公元七一二年到七七零年。遇見李白的時候，他還只是一位默默無聞的年輕後進。", "公元七四四年，在洛陽，三十三歲的杜甫，遇見了四十五歲的李白。一個是追星的粉絲，一個是當紅的明星，開啟了文學史上最傳奇的一段情誼。", "李白和杜甫，一生只見面三次！路線是：七四四年洛陽相遇，接著在梁宋同遊，還有高適同行，七四五年又在齊魯再聚。杜甫寫過：「醉眠秋共被，攜手日同行」，兩個人好到蓋同一條被子！還有一個趣事：李白帶杜甫去找范居士，結果迷路，摔進蒼耳叢，還寫詩怪蒼耳欺負他。", "杜甫真的超級想念李白！他內心小劇場大概是：白兄白兄白兄，你現在到底在哪裡呀！這是戲說，不過這份真情實感，確實寫進了他十多首詩裡。", "杜甫在〈春日憶李白〉說：「白也詩無敵，飄然思不群。」在〈天末懷李白〉又說：「世人皆欲殺，吾意獨憐才。」當全世界都在質疑李白的時候，只有杜甫挺身相惜。專家也提醒，互贈詩是社交傳統，感情不能只用數量來衡量。", "再來是杜甫的成分分析。國計民生百分之六十，想念李白百分之二十五，憂國憂民百分之十五，合起來是一百。這是戲說，形容這位寫實派詩聖的內心世界。", "我們來欣賞杜甫的〈贈李白〉。詩句請看畫面，大家一起念一遍。白話意譯是：我在洛陽生活困頓，厭倦官場，想要採藥修道，卻缺少錢。聽說李兄離開宮廷去尋仙問道，我期待能跟著你一起去梁宋採仙草！", "杜甫寫給李白的詩，數量驚人。有〈贈李白〉兩首、〈與李十二白同尋范十隱居〉、〈飲中八仙歌〉、〈冬日有懷李白〉、〈春日憶李白〉、〈天末懷李白〉、〈夢李白二首〉等等。數量要特別說明：主流說法是專寫李白的約十一首，講義寫二十幾首，是把內文提到或詩名相關的都算進去，兩種說法可以並列。", "那李白回了什麼呢？明確回贈杜甫的詩，大約有兩首：〈魯郡東石門送杜二甫〉和〈沙丘城下寄杜甫〉。另外有一首傳為李白所寫的〈戲贈杜甫〉，真偽有爭議，多數人認為是後人偽託，所以要標上存疑。", "〈魯郡東石門送杜二甫〉是李白送別杜甫的詩，名句是：「飛蓬各自遠，且盡手中杯。」意思是，我們就像隨風飄散的蓬草，各自遠去，那就先乾了手中這杯酒吧。七四五年的齊魯告別，是兩人一生中最後一次見面。", "〈沙丘城下寄杜甫〉裡有一句：「思君若汶水，浩蕩寄南征。」李白把對杜甫的思念，化成浩浩蕩蕩的汶水，一路向南陪伴著他。", "現在換孟浩然和王維。他們在長安聯句，孟浩然吟出「微雲淡河漢，疏雨滴梧桐」，驚豔全場。孟浩然落榜離開長安時，寫下：「知音世所稀。」他過世之後，王維寫了〈哭孟浩然〉：「故人不可見，漢水日東流。」傳聞王維還把孟浩然的畫像畫在刺史亭，也就是後來的浩然亭。這是知音的故事，悲劇結局則是戲說。", "李白和王維，同一年出生，又有重疊的朋友，像是孟浩然、玉真公主。但是，兩個人一生沒有留下任何互相贈詩或直接對話的紀錄！網路上說的情敵說，只是網友腦補，推論是兩人的圈子與性格不同。", "接下來是尷尬的床下事件，這是傳聞，出自《新唐書》：有一次皇上突然到王維家拜訪，孟浩然嚇得躲到床底下！王維只好據實以告，玄宗就請他出來朗誦詩。孟浩然念出：「不才明主棄，多病故人疏。」玄宗不高興地說：「你自己不求官，我哪裡有拋棄你？」隨後就把他放回去了。", "安史之亂以後，四個人的結局是：李白捲入永王事件，被流放夜郎，七六二年病逝，享年六十二歲。杜甫顛沛流離，寫下許多史詩，七七零年病逝在湘江，享年五十九歲。王維被迫接受偽職，因為一首〈凝碧池〉詩，免去大罪，七六一年過世。孟浩然則在七四零年，安史之亂之前就早逝了。杜甫在〈夢李白〉寫下：「死別已吞聲，生別常惻惻。」", "總而言之，杜甫崇拜李白，李白崇拜孟浩然，孟浩然和王維互為知音。注意，單向的箭頭代表崇拜與寫詩，不代表對方有同樣的回應。這是一場跨越千年的文學單向奔赴，也是盛唐的浪漫。", "這是四個人的社交關係圖：杜甫是李白的年下迷弟，李白瘋狂為孟浩然點讚，孟浩然和王維是田園知音。大家可以對照這張圖，複習剛剛的故事。", "最後是課堂討論。第一，寫詩算不算已讀？杜甫寫十多首，李白只回兩首，誰更重視這段友情？第二，剛剛的情節，哪些是史料、哪些是傳聞、哪些是戲說？第三，如果盛唐四人創一個LINE群組，誰會是永遠已讀不回的人？第四，李白一生沒有參加科舉，為什麼還能成為盛唐詩仙？課後還有活動：關係圖填空、詩句配對、史料搶答。", "這份簡報的參考資料，包括香港公共圖書館《文人的友誼》文字稿、《新唐書》、《唐摭言》、《唐才子傳》、《舊唐書》，以及施蟄存的《盛唐詩話》等。唐詩原文是公版著作，有趣的解讀，已經標註為戲說與傳聞。謝謝大家！"];
var synth=window.speechSynthesis||null,voice=null,nOn=true,auto=true,tok=0,timer=null;
function pickVoice(){if(!synth)return;var vs=synth.getVoices(),f=null,i,l;voice=null;
for(i=0;i<vs.length;i++){l=(vs[i].lang||'').replace('_','-').toLowerCase();if(l==='zh-tw'){f=vs[i];break;}}
voice=f;var m=$('vs');
if(!synth){m.textContent='此瀏覽器不支援語音旁白，請看畫面下方文字。';}
else if(!voice&&vs.length){m.textContent='找不到「國語（台灣）」語音。iPad 請到 設定 → 輔助使用 → 朗讀內容 → 聲音 → 中文 → 國語（台灣）下載後，重新整理頁面。';}
else if(voice){m.textContent='';}}
if(synth){pickVoice();if(synth.addEventListener)synth.addEventListener('voiceschanged',pickVoice);else synth.onvoiceschanged=pickVoice;}
function stopSpeak(){tok++;clearTimeout(timer);if(synth){try{synth.cancel();}catch(e){}}}
function speak(i){
if(!synth||!nOn)return;var my=++tok;clearTimeout(timer);
var parts=(NAR[i]||'').match(/[^。！？；]+[。！？；」]*/g)||[];var k=0;
function next(){if(my!==tok)return;
if(k>=parts.length){if(auto&&i<N-1&&$('ov').style.display==='flex'){timer=setTimeout(function(){if(my===tok)show(i+1);},800);}return;}
var u=new SpeechSynthesisUtterance(parts[k++]);u.lang='zh-TW';if(voice)u.voice=voice;u.rate=0.95;u.pitch=1;
u.onend=next;u.onerror=function(){if(my===tok)setTimeout(next,50);};
synth.speak(u);}
if(synth.speaking||synth.pending){synth.cancel();setTimeout(next,80);}else{next();}}
function show(i){cur=(i+N)%N;$('ov').style.display='flex';$('ovs').innerHTML=S[cur].svg;$('ovn').textContent=(cur+1)+' / '+N;$('ovt').textContent=NAR[cur];stopSpeak();speak(cur);}
function closeOv(){$('ov').style.display='none';stopSpeak();}
function syncBtns(){$('osp').textContent='🔊 旁白：'+(nOn?'開':'關');$('osp').className=nOn?'on':'';$('oau').textContent='自動換頁：'+(auto?'開':'關');$('oau').className=auto?'on':'';}
$('osp').onclick=function(){nOn=!nOn;syncBtns();if(nOn)speak(cur);else stopSpeak();};
$('oau').onclick=function(){auto=!auto;syncBtns();};
syncBtns();
(function(){var x0=null;var o=$('ov');
o.addEventListener('touchstart',function(e){x0=e.touches[0].clientX;},{passive:true});
o.addEventListener('touchend',function(e){if(x0===null)return;var dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>60){if(dx<0)show(cur+1);else show(cur-1);}},{passive:true});})();
document.addEventListener('visibilitychange',function(){if(document.hidden)stopSpeak();});
$('g').addEventListener('click',function(e){
var d=e.target.getAttribute('data-d');
if(d!==null){toPng(parseInt(d,10));return;}
var n=e.target;while(n&&n!==this){if(n.getAttribute&&n.getAttribute('data-o')!==null){show(parseInt(n.getAttribute('data-o'),10));return;}n=n.parentNode;}
});
$('bplay').onclick=function(){show(0);};
$('ball').onclick=async function(){
  showMsg('開始下載全部 26 張簡報 PNG，請稍候...');
  for(var i=0;i<N;i++){await toPng(i);await new Promise(function(r){setTimeout(r,350);});}
};
$('op').onclick=function(){show(cur-1);};
$('on').onclick=function(){show(cur+1);};
$('od').onclick=function(){toPng(cur);};
$('ox').onclick=closeOv;
document.addEventListener('keydown',function(e){
if($('ov').style.display!=='flex')return;
if(e.key==='ArrowRight')show(cur+1);
else if(e.key==='ArrowLeft')show(cur-1);
else if(e.key==='Escape')closeOv();
});
